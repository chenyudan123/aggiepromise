---
layout: default
---
<header class="page-hero">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body{% if page.wide %} is-wide{% endif %}">
  {{ content }}
</div>
