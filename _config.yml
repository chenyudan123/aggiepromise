# ---------------------------------------------------------------
# AggiePromise Project website — Jekyll configuration
# Edit the values below, then commit. GitHub Pages rebuilds automatically.
# ---------------------------------------------------------------

title: AggiePromise Project
tagline: Promoting successful employment for North Carolina youth with disabilities
description: >-
  The AggiePromise Project studies how youth with disabilities in North Carolina
  move from high school into work, and shares what we learn with youth, families,
  practitioners, and policymakers.

# If the site lives at https://USERNAME.github.io/REPO-NAME/, set baseurl to "/REPO-NAME".
# If it lives at https://USERNAME.github.io/ or on a custom domain, leave baseurl as "".
baseurl: ""
url: ""            # e.g. "https://username.github.io"

lang: en-US

# ---- Project facts (used in the footer, About page, and funding statement) ----
project:
  full_title: >-
    Promoting Successful Employment Trajectories for Youth with Disabilities During
    School-to-Work Transition: The Role of Personal, Family, and Workplace Experiences
  institution: North Carolina Agricultural and Technical State University
  address: 1601 East Market Street, Greensboro, NC 27411
  email: aggiepromise@ncat.edu
  phone: 336-285-4944
  grant_number: 90IFST0010
  funder: National Institute on Disability, Independent Living, and Rehabilitation Research (NIDILRR)
  funder_short: NIDILRR
  program: Field Initiated Projects (FIP) — Employment Outcomes
  period: September 2022 – August 2027 (extended)
  naric_url: https://search.naric.com/research/pd/redesign_record.cfm?search=1&type=advanced&display=detailed&fld1=PI&txt1=Yudan

# ---- Collections ----
collections:
  stories:
    output: true
    permalink: /stories/:name/
  findings:
    output: false
  working_papers:
    output: true
    permalink: /working-papers/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: stories
    values:
      layout: story
  - scope:
      path: ""
      type: working_papers
    values:
      layout: working-paper

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - preview-build.py
  - _preview
  - vendor
